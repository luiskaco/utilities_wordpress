name: Release WordPress Plugin

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Nombre de la carpeta del plugin (ej: wp-llms-txt)'
        required: true
        type: choice
        options:
          - wp-llms-txt
          - essential-hardening
          - modern-wp-migrator
      version:
        description: 'Versión del plugin (ej: 1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Determinar plugin y versión
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN: ${{ github.event.inputs.plugin }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PLUGIN="$INPUT_PLUGIN"
            VERSION="$INPUT_VERSION"
            TAG="${PLUGIN}-v${VERSION}"
          else
            TAG="$REF_NAME"
            # Extraer slug antes de -v y versión después de -v
            PLUGIN=$(echo "$TAG" | sed -E 's/-v[0-9].*//')
            VERSION=$(echo "$TAG" | sed -E 's/.*-v//')
          fi

          # Validar formato antes de usar los valores en rutas o comandos
          if ! echo "$PLUGIN" | grep -Eq '^[a-z0-9-]+$'; then
            echo "Error: slug de plugin inválido."
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "Error: versión inválida."
            exit 1
          fi

          echo "plugin=$PLUGIN" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Verificar que el plugin existe y que la versión coincide
        env:
          PLUGIN: ${{ steps.vars.outputs.plugin }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          PLUGIN_DIR="plugins/${PLUGIN}"
          if [ ! -d "$PLUGIN_DIR" ]; then
            echo "Error: El directorio $PLUGIN_DIR no existe."
            exit 1
          fi

          # La cabecera del plugin debe declarar la misma versión que el tag
          HEADER_VERSION=$(grep -m1 -iE '^[ \t*]*Version:' "$PLUGIN_DIR/${PLUGIN}.php" | sed -E 's/.*Version:[ \t]*//' | tr -d '\r ')
          if [ "$HEADER_VERSION" != "$VERSION" ]; then
            echo "Error: la cabecera del plugin dice $HEADER_VERSION pero el tag es $VERSION."
            exit 1
          fi

      - name: Empaquetar plugin para distribución en WordPress
        env:
          PLUGIN: ${{ steps.vars.outputs.plugin }}
        run: |
          mkdir -p "dist_build/${PLUGIN}"
          # "/." copia también archivos ocultos (ej. storage/.htaccess)
          cp -r "plugins/${PLUGIN}/." "dist_build/${PLUGIN}/"

          # Crear ZIP con la estructura nativa requerida por WordPress (<slug>/...)
          cd dist_build
          zip -r "../${PLUGIN}.zip" "${PLUGIN}"
          cd ..

      - name: Publicar Release en GitHub con el archivo ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "${{ steps.vars.outputs.plugin }} v${{ steps.vars.outputs.version }}"
          files: "${{ steps.vars.outputs.plugin }}.zip"
          generate_release_notes: true
          draft: false
          prerelease: false
